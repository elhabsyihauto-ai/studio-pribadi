    else pil.figur = URUT_FIGUR.filter(function (x) { return x === id || pil.figur.indexOf(x) >= 0; });
    gambar();
  }
  function togAjakan(id) {
    simpanIde();
    var i = pil.ajakan.indexOf(id);
    if (id === "ai") pil.ajakan = ["ai"];
    else if (i >= 0) { pil.ajakan.splice(i, 1); if (!pil.ajakan.length) pil.ajakan = ["ai"]; }
    else { pil.ajakan = pil.ajakan.filter(function (x) { return x !== "ai"; }); if (pil.ajakan.length >= 2) pil.ajakan.shift(); pil.ajakan.push(id); }
    gambar();
  }
  function teksAjakan() {
    if (!pil) return "";
    var bag = pil.ajakan.map(function (id) {
      if (id === "sendiri") { var t = (pil.ajakanSendiri || "").trim(); return t ? "say this call to action in natural Indonesian (you may shorten it to fit, keep its meaning): \"" + t + "\"" : ""; }
      var x = AJAKAN.filter(function (a) { return a.id === id; })[0]; if (!x) return "";
      return x.en + (id === "live" && (pil.jadwalLive || "").trim() ? " (schedule: " + pil.jadwalLive.trim() + ")" : "");
    }).filter(Boolean);
    return bag.join("; and ");
  }
  function unggahFoto(id, input) {
    var file = input && input.files && input.files[0]; if (!file) return;
    simpanIde();
    var fr = new FileReader();
    fr.onload = function () {
      var img = new Image();
      img.onload = function () {
        var s = Math.min(1, 1024 / Math.max(img.width, img.height)), cv = document.createElement("canvas");
        cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s);
        cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
        var url = cv.toDataURL("image/jpeg", 0.9);
        fotoSementara[id] = { mime: "image/jpeg", data: url.split(",")[1], url: url };
        pil.foto[id] = "sementara"; gambar();
      };
      img.onerror = function () { dialog("Foto gagal dibaca", "File ini bukan gambar yang bisa dibaca.", null); };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  }

  function mulaiAplikasi() { gambar(); muatFotoResmi(); }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", mulaiAplikasi); else setTimeout(mulaiAplikasi, 0);

  return {
    buka: buka, set: set, setDiam: setDiam, setOutfit: setOutfit, setFoto: setFoto, togFigur: togFigur, unggahFoto: unggahFoto, mulai: mulai,
    togAjakan: togAjakan, setDetail: setDetail, togSerasi: togSerasi, ideSet: ideSet, buatIde: buatIde, pakaiIde: pakaiIde, lanjut: lanjut, pilihTab: pilihTab, tutupNo: tutupNo, tekanDialog: tekanDialog,
    _uji: { kerja: function () { return kerja; }, konfig: function () { return konfig(); }, pil: function () { return pil; }, tambahKonteks: tambahKonteks }
  };
})();
